name: HanziLock
options:
  bundleIdPrefix: com.antoninclouet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # <-- mets ton Team ID (App Store Connect → Membership)
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  HanziLock:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoninclouet.hanzilock
        INFOPLIST_FILE: Config/HanziLock-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/HanziLock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"          # iPhone uniquement (mets "1,2" pour ajouter iPad)
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: HanziWidgetExtension

  HanziWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoninclouet.hanzilock.HanziWidget
        INFOPLIST_FILE: Config/HanziWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/HanziWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  HanziLock:
    build:
      targets:
        HanziLock: all
        HanziWidgetExtension: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Configuration.storekit
    test:
      config: Debug
    archive:
      config: Release
