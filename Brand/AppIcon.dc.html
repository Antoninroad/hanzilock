<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{ --paper:#EDE7DC; --paper-soft:#F6F2E9; --ink:#1C1A17; --ink-soft:#5B564C; --seal:#B7301F; --line:rgba(28,26,23,0.14); }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans", sans-serif; }
  a{ color:var(--seal); } a:hover{ color:#8C2216; }
</style>
</helmet>

<div style="width:900px; height:560px; padding:56px 64px; display:flex; flex-direction:column; gap:30px;">

  <div style="display:flex; justify-content:space-between; align-items:baseline;">
    <div style="font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--seal);">Identité visuelle — Icône d'app (iOS 18)</div>
    <div style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft);">04 / 05</div>
  </div>

  <div style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:28px;">

    <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
      <div style="width:168px; height:168px; border-radius:38px; background:#EDE7DC; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -8px rgba(0,0,0,0.25);">
        <svg viewBox="0 0 200 200" width="120" height="120">
          <rect x="6" y="6" width="188" height="188" rx="26" fill="#B7301F"/>
          <rect x="20" y="20" width="160" height="160" rx="16" fill="none" stroke="#EDE7DC" stroke-width="6"/>
          <text x="100" y="136" text-anchor="middle" font-family="'Noto Serif SC', serif" font-weight="900" font-size="106" fill="#EDE7DC">印</text>
        </svg>
      </div>
      <div style="text-align:center;">
        <div style="font-size:13px; font-weight:600;">Claire</div>
        <div style="font-size:11.5px; color:var(--ink-soft);">Fond papier par défaut</div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
      <div style="width:168px; height:168px; border-radius:38px; background:#1C1A17; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -8px rgba(0,0,0,0.4);">
        <svg viewBox="0 0 200 200" width="120" height="120">
          <rect x="6" y="6" width="188" height="188" rx="26" fill="#E2503C"/>
          <rect x="20" y="20" width="160" height="160" rx="16" fill="none" stroke="#1C1A17" stroke-width="6"/>
          <text x="100" y="136" text-anchor="middle" font-family="'Noto Serif SC', serif" font-weight="900" font-size="106" fill="#1C1A17">印</text>
        </svg>
      </div>
      <div style="text-align:center;">
        <div style="font-size:13px; font-weight:600;">Sombre</div>
        <div style="font-size:11.5px; color:var(--ink-soft);">Sceau éclairci pour rester lisible sur fond encre</div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
      <div style="width:168px; height:168px; border-radius:38px; background:#8A8578; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -8px rgba(0,0,0,0.3);">
        <svg viewBox="0 0 200 200" width="120" height="120">
          <rect x="6" y="6" width="188" height="188" rx="26" fill="#00000055"/>
          <rect x="20" y="20" width="160" height="160" rx="16" fill="none" stroke="#F2F0EA" stroke-width="6" opacity="0.9"/>
          <text x="100" y="136" text-anchor="middle" font-family="'Noto Serif SC', serif" font-weight="900" font-size="106" fill="#F2F0EA">印</text>
        </svg>
      </div>
      <div style="text-align:center;">
        <div style="font-size:13px; font-weight:600;">Tintée</div>
        <div style="font-size:11.5px; color:var(--ink-soft);">Silhouette monochrome — iOS applique la teinte choisie par l'utilisateur</div>
      </div>
    </div>

  </div>

  <div style="border-top:1px solid var(--line); padding-top:24px; display:flex; flex-direction:column; gap:12px;">
    <div style="font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);">En contexte — grille d'écran d'accueil</div>
    <div style="display:flex; gap:14px;">
      <div style="width:56px; height:56px; border-radius:14px; background:#D9D4C8;"></div>
      <div style="width:56px; height:56px; border-radius:14px; background:#D9D4C8;"></div>
      <div style="width:56px; height:56px; border-radius:14px; background:#B7301F; display:flex; align-items:center; justify-content:center;">
        <svg viewBox="0 0 200 200" width="38" height="38"><text x="100" y="136" text-anchor="middle" font-family="'Noto Serif SC', serif" font-weight="900" font-size="106" fill="#EDE7DC">印</text></svg>
      </div>
      <div style="width:56px; height:56px; border-radius:14px; background:#D9D4C8;"></div>
      <div style="width:56px; height:56px; border-radius:14px; background:#D9D4C8;"></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
